id: backchannel_haan_hi
family: backchannel
language: hi
title: एजेंट के बोलते समय हाँ कहना
description: While the agent explains, the caller says a short haan. The agent should carry on talking.
steps:
- say: मुझे विस्तार से बताइए कि नया कनेक्शन लेने की प्रक्रिया क्या है।
  id: ask
- wait_agent_speech:
    for: 2.0
    oracle: जी बिल्कुल। मैं आपको पूरी जानकारी एक एक करके देता हूँ। सबसे पहले आपको अपने खाते से या इसी कॉल पर एक अनुरोध दर्ज करना होता है। उसके बाद हम आपके ऑर्डर की जानकारी जाँचते हैं और आपसे उसकी पुष्टि करते हैं। फिर हमारी टीम उस अनुरोध को देखती है, जिसमें आम तौर पर एक से दो दिन लगते हैं। मंज़ूरी मिलने के बाद आपके फ़ोन पर एक संदेश आता है, और आगे की जानकारी ईमेल से भेजी जाती है। अगर कहीं भी कोई दिक्कत हो, तो आप हमें दोबारा कॉल कर सकते हैं।
- say: हाँ।
  id: filler
  kind: backchannel
- listen: {}
checks:
- type: backchannel_ignored
