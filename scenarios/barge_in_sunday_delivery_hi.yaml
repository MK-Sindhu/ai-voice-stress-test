id: barge_in_sunday_delivery_hi
family: barge_in
language: hi
title: बीच में टोककर रविवार की डिलीवरी पूछना
description: The caller asks for all delivery options, then interrupts the long answer with one specific question.
steps:
- say: कृपया मुझे अपनी डिलीवरी के सारे विकल्प विस्तार से बताइए।
  id: ask
- wait_agent_speech:
    for: 2.0
    oracle: जी बिल्कुल। मैं आपको पूरी जानकारी एक एक करके देता हूँ। सबसे पहले आपको अपने खाते से या इसी कॉल पर एक अनुरोध दर्ज करना होता है। उसके बाद हम आपके ऑर्डर की जानकारी जाँचते हैं और आपसे उसकी पुष्टि करते हैं। फिर हमारी टीम उस अनुरोध को देखती है, जिसमें आम तौर पर एक से दो दिन लगते हैं। मंज़ूरी मिलने के बाद आपके फ़ोन पर एक संदेश आता है, और आगे की जानकारी ईमेल से भेजी जाती है। अगर कहीं भी कोई दिक्कत हो, तो आप हमें दोबारा कॉल कर सकते हैं।
- say: रुकिए, मुझे बस इतना बताइए कि क्या आप रविवार को डिलीवरी करते हैं?
  id: cut
  kind: barge_in
- listen:
    oracle: जी हाँ, हम रविवार को भी डिलीवरी करते हैं।
checks:
- type: barge_in_stops
- type: recovery
  reply_to: cut
  mentions:
  - - रविवार
    - Sunday
    - संडे
    - इतवार
