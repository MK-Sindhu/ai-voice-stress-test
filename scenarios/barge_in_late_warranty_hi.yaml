id: barge_in_late_warranty_hi
family: barge_in
language: hi
title: लंबा जवाब सुनने के बाद टोकना
description: The caller listens to four seconds of a long answer before interrupting with a short, direct question.
steps:
- say: अपनी वारंटी की शर्तें विस्तार से समझाइए।
  id: ask
- wait_agent_speech:
    for: 4.0
    oracle: जी बिल्कुल। मैं आपको पूरी जानकारी एक एक करके देता हूँ। सबसे पहले आपको अपने खाते से या इसी कॉल पर एक अनुरोध दर्ज करना होता है। उसके बाद हम आपके ऑर्डर की जानकारी जाँचते हैं और आपसे उसकी पुष्टि करते हैं। फिर हमारी टीम उस अनुरोध को देखती है, जिसमें आम तौर पर एक से दो दिन लगते हैं। मंज़ूरी मिलने के बाद आपके फ़ोन पर एक संदेश आता है, और आगे की जानकारी ईमेल से भेजी जाती है। अगर कहीं भी कोई दिक्कत हो, तो आप हमें दोबारा कॉल कर सकते हैं।
- say: ठीक है ठीक है, बस ये बताइए कि वारंटी कितने साल की है?
  id: cut
  kind: barge_in
- listen:
    oracle: वारंटी 2 साल की है।
checks:
- type: barge_in_stops
- type: recovery
  reply_to: cut
  mentions:
  - - साल
    - year
    - वर्ष
    - महीने
    - month
