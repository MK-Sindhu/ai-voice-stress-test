id: pause_appointment_hinglish
family: mid_thought_pause
language: hinglish
title: Appointment ka time sochte hue rukna
description: The caller asks for a doctor's appointment, hesitates for a second and a half, then gives the time.
steps:
- say: Mujhe doctor Sharma ke saath appointment chahiye,
  spoken: मुझे डॉक्टर शर्मा के साथ अपॉइंटमेंट चाहिए,
  id: first
- pause: 1.5
- say: kal subah gyarah baje ka.
  spoken: कल सुबह ग्यारह बजे का।
  id: rest
- listen:
    oracle: ठीक है, डॉक्टर शर्मा के साथ कल सुबह 11 बजे का अपॉइंटमेंट बुक कर दिया है।
checks:
- type: no_false_interruption
- type: mentions
  reply_to: rest
  mentions:
  - - '11'
