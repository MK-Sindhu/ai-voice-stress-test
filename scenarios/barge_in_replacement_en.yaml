id: barge_in_replacement_en
family: barge_in
language: en-IN
title: Cutting in to ask for a replacement
description: The caller asks for the return policy, then cuts into the answer two seconds in to say they want a replacement instead. The agent must stop and deal with the new request.
steps:
- say: Can you explain your return policy in detail?
  id: ask
- wait_agent_speech:
    for: 2.0
    oracle: Of course. Let me walk you through it step by step. First, you raise a request from your account page or on this call. Then we verify the details of your order and confirm them with you. After that, our team reviews the request, which usually takes one to two working days. Once it is approved, you get a confirmation message on your phone, and the next steps are shared by email. If anything is unclear at any point, you can call us back and we will help you.
- say: No wait, I don't want a refund, I want a replacement.
  id: cut
  kind: barge_in
- listen:
    oracle: Sure, I will arrange a replacement for you instead. Can I have your order number?
checks:
- type: barge_in_stops
- type: recovery
  reply_to: cut
  mentions:
  - - replacement
    - replace
