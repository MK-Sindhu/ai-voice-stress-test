id: barge_in_cancel_subscription_hinglish
family: barge_in
language: hinglish
title: Beech mein tok kar subscription cancel karna
description: The caller asks about subscription plans, then interrupts to say they want to cancel instead.
steps:
- say: Mujhe apne subscription plans ke baare mein detail mein batao.
  spoken: मुझे अपने सब्सक्रिप्शन प्लान्स के बारे में डिटेल में बताओ।
  id: ask
- wait_agent_speech:
    for: 2.0
    oracle: जी बिल्कुल। मैं आपको पूरी जानकारी एक एक करके देता हूँ। सबसे पहले आपको अपने खाते से या इसी कॉल पर एक अनुरोध दर्ज करना होता है। उसके बाद हम आपके ऑर्डर की जानकारी जाँचते हैं और आपसे उसकी पुष्टि करते हैं। फिर हमारी टीम उस अनुरोध को देखती है, जिसमें आम तौर पर एक से दो दिन लगते हैं। मंज़ूरी मिलने के बाद आपके फ़ोन पर एक संदेश आता है, और आगे की जानकारी ईमेल से भेजी जाती है। अगर कहीं भी कोई दिक्कत हो, तो आप हमें दोबारा कॉल कर सकते हैं।
- say: Ek minute, mujhe plan nahi chahiye, mujhe subscription cancel karna hai.
  spoken: एक मिनट, मुझे प्लान नहीं चाहिए, मुझे सब्सक्रिप्शन कैंसल करना है।
  id: cut
  kind: barge_in
- listen:
    oracle: ठीक है, मैं आपका सब्सक्रिप्शन कैंसल कर देता हूँ।
checks:
- type: barge_in_stops
- type: recovery
  reply_to: cut
  mentions:
  - - कैंसल
    - cancel
    - रद्द
    - कैंसिल
    - कैन्सल
