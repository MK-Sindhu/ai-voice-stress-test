[project]
name = "stress-test-arena"
version = "0.1.0"
description = "An automated caller that stress-tests voice agents on Indian speech and scores them"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The core is deliberately light: the engine, the fake agents, the metrics and
# the tests need nothing heavier than numpy. CI installs only this.
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
# Everything needed to render the caller's voice, run the local baseline
# agents and reproduce the leaderboard.
local = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "faster-whisper>=1.1",
    "silero-vad>=5.1",
    "torch",
    "transformers",
    "httpx",
    "mlflow",
    "dvc",
]
# Network clients for the commercial platform adapters (untested, see README).
commercial = [
    "websockets>=13",
    "httpx",
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
